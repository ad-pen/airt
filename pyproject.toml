[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airt"
version = "0.1.0"
description = "AI Red Teaming Workbench — practitioner-focused AI security testing tool"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Abdallah Dahouk" }]
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
airt = "airt.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/airt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
